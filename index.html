<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Query Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #888;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .container.centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 40px);
      max-width: 600px;
    }
    .query-display {
      text-align: center;
      margin-bottom: 24px;
    }
    .query-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .query-text {
      font-size: 18px;
      color: #ccc;
      word-break: break-word;
    }
    .section-title {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .option-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .option-card:hover {
      background: #161616;
      border-color: #333;
      transform: translateY(-1px);
    }
    .option-card.recommended {
      border-color: #2a4a5a;
      background: #0d1a1f;
    }
    .option-card.recommended:hover {
      border-color: #3a6a7a;
      background: #112530;
    }
    .option-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .option-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .option-card .option-icon svg { color: #666; }
    .option-card.recommended .option-icon svg { color: #7ac; }
    .option-title {
      font-size: 13px;
      color: #bbb;
      font-weight: 500;
    }
    .option-card.recommended .option-title { color: #7ac; }
    .option-desc {
      font-size: 11px;
      color: #555;
      line-height: 1.4;
      padding-left: 32px;
    }
    .option-badge {
      font-size: 9px;
      color: #5a8a9a;
      background: #1a2a30;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: auto;
    }
    .engines-preview {
      font-size: 10px;
      color: #444;
      padding-left: 32px;
      margin-top: 6px;
    }
    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 24px 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #222;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    .spinner-small {
      width: 16px;
      height: 16px;
      border: 2px solid #333;
      border-top-color: #666;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      width: 100%;
    }
    .search-input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 16px;
      color: #ccc;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #333; }
    .search-input::placeholder { color: #444; }
    .search-btn {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 20px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-btn:hover {
      background: #222;
      color: #aaa;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #333;
    }
    .entity-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .entity-pill {
      padding: 3px 10px;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 12px;
      font-size: 10px;
    }
    .entity-pill .type { color: #666; }
    .entity-pill .value { color: #7ac; margin-left: 4px; }
    .entity-pill .country { color: #a86; margin-left: 4px; font-size: 9px; }
    .filter-container {
      margin-bottom: 16px;
      position: relative;
    }
    .filter-input {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px 10px 36px;
      color: #ccc;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .filter-input:focus {
      border-color: #333;
      background: #151515;
    }
    .filter-input::placeholder { color: #444; }
    .filter-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #444;
      pointer-events: none;
    }
    .filter-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }
    .option-card.hidden { display: none; }
    .no-results {
      text-align: center;
      padding: 24px;
      color: #444;
      font-size: 13px;
    }

    /* Results View Styles */
    .results-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .back-btn {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 8px 12px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      background: #181818;
      border-color: #333;
      color: #aaa;
    }
    .back-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .results-title {
      flex: 1;
    }
    .results-title h2 {
      font-size: 16px;
      color: #ccc;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .results-title .subtitle {
      font-size: 11px;
      color: #555;
    }
    .progress-bar {
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2a5a7a, #7ac);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .results-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-item {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 16px;
      text-align: center;
      flex: 1;
    }
    .stat-value {
      font-size: 20px;
      color: #ccc;
      font-weight: 500;
    }
    .stat-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .source-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
    }
    .source-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }
    .source-header:hover {
      background: #121212;
    }
    .source-icon {
      width: 24px;
      height: 24px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
    }
    .source-name {
      flex: 1;
      font-size: 13px;
      color: #bbb;
      font-weight: 500;
    }
    .source-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .source-status.loading {
      color: #a98;
      background: #1a1815;
    }
    .source-status.success {
      color: #6a6;
      background: #1a2a1a;
    }
    .source-status.error {
      color: #a66;
      background: #2a1a1a;
    }
    .source-status.partial {
      color: #aa6;
      background: #2a2a1a;
    }
    .source-expand {
      color: #444;
      transition: transform 0.2s;
    }
    .source-expand svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .source-card.expanded .source-expand {
      transform: rotate(180deg);
    }
    .source-results {
      display: none;
      padding: 16px;
    }
    .source-card.expanded .source-results {
      display: block;
    }
    .result-item {
      padding: 12px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-title {
      font-size: 13px;
      color: #7ac;
      margin-bottom: 6px;
      text-decoration: none;
      display: block;
    }
    .result-title:hover {
      text-decoration: underline;
    }
    .result-snippet {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .result-url {
      font-size: 10px;
      color: #4a4;
      word-break: break-all;
    }
    .result-meta {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 10px;
      color: #555;
    }
    .open-source-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #888;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .open-source-btn:hover {
      background: #222;
      color: #aaa;
      border-color: #333;
    }
    .open-source-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .empty-results {
      text-align: center;
      padding: 24px;
      color: #444;
      font-size: 12px;
    }
    .iframe-container {
      width: 100%;
      height: 400px;
      border: 1px solid #222;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .source-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .open-all-btn {
      background: #1a2a30;
      border: 1px solid #2a4a5a;
      border-radius: 6px;
      padding: 10px 16px;
      color: #7ac;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .open-all-btn:hover {
      background: #1a3040;
      border-color: #3a6a7a;
    }
    .open-all-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
  </style>
</head>

      image: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>',

      code: '<svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',

      search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
      arrowLeft: '<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
      externalLink: '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      chevronDown: '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>',
      tabs: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v6"/></svg>',
    };

    function getIcon(iconName) {
      return SVG_ICONS[iconName] || SVG_ICONS.search;
    }

    // CORS Proxy for fetching external content
    const CORS_PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    ];

    async function fetchWithProxy(url, timeout = 10000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);

      for (const proxyFn of CORS_PROXIES) {
        try {
          const proxyUrl = proxyFn(url);
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (response.ok) {
            return await response.text();
          }
        } catch (e) {
          continue;
        }
      }
      clearTimeout(timeoutId);
      throw new Error('All proxies failed');
    }

    // Parse results from HTML
    function parseResults(html, engine, url) {
      const results = [];
      const doc = new DOMParser().parseFromString(html, 'text/html');

      // Generic extraction - try to find links and text
      const links = doc.querySelectorAll('a[href]');
      const seen = new Set();

      links.forEach(link => {
        const href = link.href;
        const text = link.textContent?.trim();

        if (!text || text.length < 5 || seen.has(text)) return;
        if (href.includes('javascript:') || href.startsWith('#')) return;

        // Get parent context for snippet
        let snippet = '';
        let parent = link.parentElement;
        for (let i = 0; i < 3 && parent; i++) {
          const parentText = parent.textContent?.trim();
          if (parentText && parentText.length > text.length + 20) {
            snippet = parentText.substring(0, 200);
            break;
          }
          parent = parent.parentElement;
        }

        seen.add(text);
        results.push({
          title: text.substring(0, 100),
          url: href,
          snippet: snippet.replace(text, '').trim().substring(0, 150),
        });
      });

      return results.slice(0, 10);
    }

      analyze(query) {
        const result = { query, entities: [], recommendedOptions: [], allOptions: [] };

        for (const [type, config] of Object.entries(this.entities)) {
          const matches = query.match(config.pattern);
          if (matches) {
            result.entities.push({ type, label: config.label, values: [...new Set(matches)], country: config.country, category: config.category });
          }
        }

        const entityTypes = result.entities.map(e => e.type);
        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.forEntities?.some(e => entityTypes.includes(e))) {
            result.recommendedOptions.push({ key, ...opt, reason: 'entity' });
          }
        }

        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.triggers?.test(query) && !result.recommendedOptions.some(r => r.key === key)) {
            result.recommendedOptions.push({ key, ...opt, reason: 'intent' });
          }
        }

        if (result.recommendedOptions.length === 0) {
          const namePattern = /^[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+$/;
          if (namePattern.test(query.trim())) {
            result.recommendedOptions.push({ key: 'person', ...this.searchOptions.person, reason: 'name' });
          }
        }

        if (result.recommendedOptions.length === 0) {
          result.recommendedOptions.push({ key: 'general', ...this.searchOptions.general, reason: 'default' });
        }

        result.allOptions = Object.entries(this.searchOptions)
          .filter(([key]) => !result.recommendedOptions.some(r => r.key === key))
          .map(([key, opt]) => ({ key, ...opt }));

        return result;
      },

      getSearchUrls(query, optionKey) {
        const option = this.searchOptions[optionKey];
        if (!option) return [];

        const queries = option.buildQuery(query);
        return option.engines
          .filter(eng => queries[eng] !== null && queries[eng] !== undefined && this.engines[eng])
          .map(eng => ({
            engine: eng,
            name: this.engineNames[eng] || eng,
            url: this.engines[eng](queries[eng] || queries.default || query),
            query: queries[eng] || queries.default || query,
          }));
      }
    };

          <input type="text" class="filter-input" id="option-filter" placeholder="Filter options..." autocomplete="off">
        </div>
      `;

      if (analysis.recommendedOptions.length > 0) {
        html += `
          <div class="section-title" data-section="recommended">Recommended</div>
          <div class="options-grid" data-grid="recommended">
            ${analysis.recommendedOptions.map(opt => renderOption(opt, analysis.query, true)).join('')}
          </div>
        `;
      }

      if (analysis.allOptions.length > 0) {
        html += `
          <div class="divider" data-section="other"></div>
          <div class="section-title" data-section="other">Other Options</div>
          <div class="options-grid" data-grid="other">
            ${analysis.allOptions.map(opt => renderOption(opt, analysis.query, false)).join('')}
          </div>
        `;
      }

      html += `
        <div class="no-results" id="no-results" style="display: none;">No options match your filter</div>
        <div class="footer">Click an option to fetch and aggregate results from all sources</div>
      `;

      app.innerHTML = html;

      document.querySelectorAll('.option-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          const optionKey = card.dataset.option;
          startAggregatedSearch(analysis.query, optionKey);
        });
      });

      // Filter functionality
      const filterInput = document.getElementById('option-filter');
      filterInput.addEventListener('input', (e) => {
        const filterValue = e.target.value.toLowerCase().trim();
        const allCards = document.querySelectorAll('.option-card');
        let visibleRecommended = 0, visibleOther = 0;

        allCards.forEach(card => {
          const title = card.querySelector('.option-title').textContent.toLowerCase();
          const desc = card.querySelector('.option-desc').textContent.toLowerCase();
          const engines = card.querySelector('.engines-preview').textContent.toLowerCase();
          const matches = title.includes(filterValue) || desc.includes(filterValue) || engines.includes(filterValue);
          card.classList.toggle('hidden', !matches);
          if (matches) card.classList.contains('recommended') ? visibleRecommended++ : visibleOther++;
        });

        document.querySelectorAll('[data-section="recommended"]').forEach(el => el.style.display = visibleRecommended > 0 ? '' : 'none');
        document.querySelector('[data-grid="recommended"]').style.display = visibleRecommended > 0 ? '' : 'none';
        if (document.querySelector('[data-grid="other"]')) {
          document.querySelectorAll('[data-section="other"]').forEach(el => el.style.display = visibleOther > 0 ? '' : 'none');
          document.querySelector('[data-grid="other"]').style.display = visibleOther > 0 ? '' : 'none';
        }
        document.getElementById('no-results').style.display = (visibleRecommended + visibleOther === 0) ? '' : 'none';
      });
    }

    function renderOption(opt, query, recommended) {
      const engineCount = opt.engines.length;
      const enginePreview = opt.engines.slice(0, 4).map(e => OSINT.engineNames[e] || e).join(', ') + (engineCount > 4 ? ` +${engineCount - 4}` : '');

      return `
        <a href="#" class="option-card ${recommended ? 'recommended' : ''}" data-option="${opt.key}">
          <div class="option-header">
            <span class="option-icon">${getIcon(opt.icon)}</span>
            <span class="option-title">${opt.title}</span>
            ${recommended ? '<span class="option-badge">Recommended</span>' : ''}
          </div>
          <div class="option-desc">${opt.desc}</div>
          <div class="engines-preview">${enginePreview}</div>
        </a>
      `;
    }

    async function startAggregatedSearch(query, optionKey) {
      const option = OSINT.searchOptions[optionKey];
      const searches = OSINT.getSearchUrls(query, optionKey);

      currentState = { view: 'results', query, optionKey, results: {}, searches };

      // Initialize results state
      searches.forEach(s => {
        currentState.results[s.engine] = { status: 'loading', results: [], url: s.url, name: s.name };
      });

      renderResultsView();

      // Fetch all sources in parallel
      const fetchPromises = searches.map(async (search) => {
        try {
          const html = await fetchWithProxy(search.url, 15000);
          const results = parseResults(html, search.engine, search.url);
          currentState.results[search.engine] = {
            status: results.length > 0 ? 'success' : 'partial',
            results,
            url: search.url,
            name: search.name
          };
        } catch (error) {
          currentState.results[search.engine] = {
            status: 'error',
            results: [],
            url: search.url,
            name: search.name,
            error: error.message
          };
        }
        updateSourceCard(search.engine);
        updateStats();
      });

      await Promise.allSettled(fetchPromises);
    }

    function renderResultsView() {
      const app = document.getElementById('app');
      app.className = 'container';
      const option = OSINT.searchOptions[currentState.optionKey];
      const totalSources = currentState.searches.length;

      app.innerHTML = `
        <div class="results-header">
          <button class="back-btn" onclick="goBack()">${getIcon('arrowLeft')} Back</button>
          <div class="results-title">
            <h2>${getIcon(option.icon)} ${option.title}</h2>
            <div class="subtitle">Searching "${escapeHtml(currentState.query)}" across ${totalSources} sources</div>
          </div>
          <button class="open-all-btn" onclick="openAllSources()">${getIcon('tabs')} Open All</button>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

        <div class="results-stats">
          <div class="stat-item"><div class="stat-value" id="stat-completed">0</div><div class="stat-label">Completed</div></div>
          <div class="stat-item"><div class="stat-value" id="stat-results">0</div><div class="stat-label">Results Found</div></div>
          <div class="stat-item"><div class="stat-value" id="stat-sources">${totalSources}</div><div class="stat-label">Sources</div></div>
        </div>

        <div class="results-list" id="results-list">
          ${currentState.searches.map(s => renderSourceCard(s.engine)).join('')}
        </div>
      `;
    }

    function renderSourceCard(engine) {
      const data = currentState.results[engine];
      const initials = data.name.substring(0, 2).toUpperCase();

      return `
        <div class="source-card" id="source-${engine}" data-engine="${engine}">
          <div class="source-header" onclick="toggleSource('${engine}')">
            <div class="source-icon">${initials}</div>
            <div class="source-name">${data.name}</div>
            <div class="source-status ${data.status}" id="status-${engine}">
              ${data.status === 'loading' ? '<div class="spinner-small"></div>' : ''}
              ${data.status === 'success' ? `${data.results.length} results` : ''}
              ${data.status === 'partial' ? 'No results' : ''}
              ${data.status === 'error' ? 'Failed' : ''}
            </div>
            <div class="source-expand">${getIcon('chevronDown')}</div>
          </div>
          <div class="source-results" id="results-${engine}">
            ${renderSourceResults(engine)}
          </div>
        </div>
      `;
    }

    function renderSourceResults(engine) {
      const data = currentState.results[engine];

      if (data.status === 'loading') {
        return '<div class="empty-results">Loading...</div>';
      }

      let html = '';

      if (data.results.length > 0) {
        html += data.results.map(r => `
          <div class="result-item">
            <a href="${escapeHtml(r.url)}" target="_blank" class="result-title">${escapeHtml(r.title)}</a>
            ${r.snippet ? `<div class="result-snippet">${escapeHtml(r.snippet)}</div>` : ''}
            <div class="result-url">${escapeHtml(r.url.substring(0, 80))}${r.url.length > 80 ? '...' : ''}</div>
          </div>
        `).join('');
      } else if (data.status !== 'loading') {
        html += '<div class="empty-results">No results could be extracted. Click below to view the source directly.</div>';
      }

      html += `<a href="${data.url}" target="_blank" class="open-source-btn">${getIcon('externalLink')} Open ${data.name} directly</a>`;

      return html;
    }

    function updateSourceCard(engine) {
      const card = document.getElementById(`source-${engine}`);
      const statusEl = document.getElementById(`status-${engine}`);
      const resultsEl = document.getElementById(`results-${engine}`);
      const data = currentState.results[engine];

      if (statusEl) {
        statusEl.className = `source-status ${data.status}`;
        statusEl.innerHTML = data.status === 'success' ? `${data.results.length} results` :
                            data.status === 'partial' ? 'No results' :
                            data.status === 'error' ? 'Failed' : '<div class="spinner-small"></div>';
      }

      if (resultsEl) {
        resultsEl.innerHTML = renderSourceResults(engine);
      }
    }

    function updateStats() {
      const results = Object.values(currentState.results);
      const completed = results.filter(r => r.status !== 'loading').length;
      const totalResults = results.reduce((sum, r) => sum + r.results.length, 0);
      const total = results.length;

      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-results').textContent = totalResults;
      document.getElementById('progress-fill').style.width = `${(completed / total) * 100}%`;
    }

    function toggleSource(engine) {
      const card = document.getElementById(`source-${engine}`);
      card.classList.toggle('expanded');
    }

    function openAllSources() {
      currentState.searches.forEach((s, i) => {
        setTimeout(() => window.open(s.url, '_blank'), i * 200);
      });
    }

    function goBack() {
      const query = currentState.query;
      window.location.href = `?q=${encodeURIComponent(query)}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Main
    (function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');

      if (!query) {
        renderSearchBox();
        return;
      }

      const analysis = OSINT.analyze(query);
      renderUI(analysis);
    })();
  </script>
</body>
</html>
