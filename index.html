<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Query Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #888;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    body:has(.container) {
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .results-container {
      width: 100%;
      max-width: 1400px;
      padding-top: 20px;
    }
    .query-display {
      text-align: center;
      margin-bottom: 32px;
    }
    .query-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .query-text {
      font-size: 18px;
      color: #ccc;
      word-break: break-word;
    }
    .detected-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      border-radius: 20px;
      font-size: 11px;
      color: #6a6;
    }
    .section-title {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .option-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .option-card:hover {
      background: #161616;
      border-color: #333;
      transform: translateY(-1px);
    }
    .option-card.recommended {
      border-color: #2a4a5a;
      background: #0d1a1f;
    }
    .option-card.recommended:hover {
      border-color: #3a6a7a;
      background: #112530;
    }
    .option-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .option-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .option-card .option-icon svg {
      color: #666;
    }
    .option-card.recommended .option-icon svg {
      color: #7ac;
    }
    .option-title {
      font-size: 13px;
      color: #bbb;
      font-weight: 500;
    }
    .option-card.recommended .option-title {
      color: #7ac;
    }
    .option-desc {
      font-size: 11px;
      color: #555;
      line-height: 1.4;
      padding-left: 32px;
    }
    .option-badge {
      font-size: 9px;
      color: #5a8a9a;
      background: #1a2a30;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: auto;
    }
    .engines-preview {
      font-size: 10px;
      color: #444;
      padding-left: 32px;
      margin-top: 6px;
    }
    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 24px 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #222;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 16px;
      color: #ccc;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: #333;
    }
    .search-input::placeholder {
      color: #444;
    }
    .search-btn {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 20px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-btn:hover {
      background: #222;
      color: #aaa;
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 6px 12px;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover, .mode-btn.active {
      border-color: #444;
      color: #888;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #333;
    }
    .entity-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .entity-pill {
      padding: 3px 10px;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 12px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .entity-pill:hover {
      background: #1a2a3a;
      border-color: #3a5a7a;
      transform: translateY(-1px);
    }
    .entity-pill .type { color: #666; }
    .entity-pill .value { color: #7ac; margin-left: 4px; }
    .entity-pill .country { color: #a86; margin-left: 4px; font-size: 9px; }
    .entity-pill .search-icon { margin-left: 6px; color: #555; font-size: 9px; }
    .filter-container {
      margin-bottom: 16px;
      position: relative;
    }
    .filter-input {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px 10px 36px;
      color: #ccc;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .filter-input:focus {
      border-color: #333;
      background: #151515;
    }
    .filter-input::placeholder {
      color: #444;
    }
    .filter-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #444;
      pointer-events: none;
    }
    .filter-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }
    .option-card.hidden {
      display: none;
    }
    .no-results {
      text-align: center;
      padding: 24px;
      color: #444;
      font-size: 13px;
    }

    /* Multi-source Results View */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #222;
    }
    .results-query {
      font-size: 16px;
      color: #ccc;
    }
    .results-query span {
      color: #7ac;
    }
    .results-back {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 16px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .results-back:hover {
      background: #222;
      color: #aaa;
    }
    .source-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      border: 1px solid #222;
    }
    .source-tab {
      padding: 6px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #666;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: capitalize;
    }
    .source-tab:hover {
      background: #222;
      border-color: #333;
      color: #888;
    }
    .source-tab.active {
      background: #1a2a3a;
      border-color: #3a5a7a;
      color: #7ac;
    }
    .source-tab.loading {
      opacity: 0.6;
    }
    .source-tab .tab-status {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-left: 6px;
    }
    .source-tab .tab-status.loading {
      background: #a86;
      animation: pulse 1s infinite;
    }
    .source-tab .tab-status.loaded {
      background: #6a6;
    }
    .source-tab .tab-status.error {
      background: #a66;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 16px;
    }
    .results-grid.single-view {
      grid-template-columns: 1fr;
    }
    .source-panel {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .source-panel.hidden {
      display: none;
    }
    .source-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #151515;
      border-bottom: 1px solid #222;
    }
    .source-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
      font-weight: 500;
      text-transform: capitalize;
    }
    .source-panel-title .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a86;
      animation: pulse 1s infinite;
    }
    .source-panel-title .status-dot.loaded {
      background: #6a6;
      animation: none;
    }
    .source-panel-title .status-dot.error {
      background: #a66;
      animation: none;
    }
    .source-panel-actions {
      display: flex;
      gap: 8px;
    }
    .source-panel-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 10px;
      color: #666;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .source-panel-btn:hover {
      background: #1a1a1a;
      color: #888;
    }
    .source-iframe-container {
      position: relative;
      height: 500px;
      background: #0d0d0d;
    }
    .source-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .source-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #555;
      font-size: 12px;
    }
    .source-loading .spinner {
      margin-bottom: 12px;
    }
    .source-error {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #666;
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }
    .source-error-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .source-error-msg {
      margin-bottom: 16px;
      color: #555;
    }
    .source-error-btn {
      background: #1a2a3a;
      border: 1px solid #2a4a5a;
      border-radius: 6px;
      padding: 10px 20px;
      color: #7ac;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .source-error-btn:hover {
      background: #223a4a;
    }
    .view-toggle {
      display: flex;
      gap: 4px;
      margin-left: 12px;
    }
    .view-toggle-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 6px 10px;
      color: #555;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-toggle-btn:hover {
      background: #222;
      color: #777;
    }
    .view-toggle-btn.active {
      background: #1a2a3a;
      border-color: #3a5a7a;
      color: #7ac;
    }
    .results-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #555;
    }
    .results-count {
      padding: 4px 10px;
      background: #151515;
      border-radius: 4px;
    }

    /* Actual Search Results Styles */
    .search-results-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .person-summary {
      background: linear-gradient(135deg, #111 0%, #1a1a2a 100%);
      border: 1px solid #2a3a4a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .person-summary-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .person-summary-image.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: #444;
    }

    .person-summary-content {
      flex: 1;
      min-width: 0;
    }

    .person-summary-title {
      font-size: 24px;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .person-summary-source {
      font-size: 11px;
      color: #5a8a9a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .person-summary-source img {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    .person-summary-desc {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }

    .infobox {
      background: #151520;
      border: 1px solid #252535;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .infobox-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .infobox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .infobox-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .infobox-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
    }

    .infobox-value {
      font-size: 13px;
      color: #bbb;
    }

    /* Quick Info Panel - Simple minimal list */
    .quick-info-panel {
      margin-bottom: 20px;
    }

    .quick-info-section {
      margin-bottom: 12px;
    }

    .quick-info-section:last-child {
      margin-bottom: 0;
    }

    .quick-info-header {
      font-size: 11px;
      font-weight: 500;
      color: #6a7a8a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .quick-info-grid {
      display: flex;
      flex-direction: column;
    }

    .quick-info-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #1a2535;
    }

    .quick-info-item:last-child {
      border-bottom: none;
    }

    .quick-info-label {
      font-size: 13px;
      color: #7a8a9a;
      min-width: 100px;
      flex-shrink: 0;
    }

    .quick-info-value {
      font-size: 13px;
      color: #c5cdd5;
      word-break: break-word;
      flex: 1;
    }

    .quick-info-link {
      font-size: 12px;
      color: #5a9fcf;
      text-decoration: none;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .quick-info-link:hover {
      color: #7ac;
    }

    .results-section {
      margin-bottom: 32px;
    }

    .results-section-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .results-section-count {
      background: #1a2a3a;
      color: #7ac;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
    }

    /* Domain Group Dropdowns */
    .domain-group {
      margin-bottom: 16px;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }
    .domain-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #151515;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .domain-group-header:hover {
      background: #1a1a1a;
    }
    .domain-group-header.collapsed {
      border-bottom: none;
    }
    .domain-group-toggle {
      width: 16px;
      height: 16px;
      color: #666;
      transition: transform 0.2s;
    }
    .domain-group-header.collapsed .domain-group-toggle {
      transform: rotate(-90deg);
    }
    .domain-group-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
    .domain-group-name {
      font-size: 13px;
      color: #ccc;
      font-weight: 500;
      flex: 1;
    }
    .domain-group-count {
      font-size: 11px;
      color: #666;
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .domain-group-content {
      padding: 8px;
      border-top: 1px solid #222;
    }
    .domain-group-header.collapsed + .domain-group-content {
      display: none;
    }
    .domain-group .result-card {
      margin-bottom: 8px;
    }
    .domain-group .result-card:last-child {
      margin-bottom: 0;
    }

    /* Simple Google-style results */
    .result-item {
      margin-bottom: 20px;
      max-width: 600px;
    }
    .result-item a.result-title {
      font-size: 18px;
      color: #8ab4f8;
      text-decoration: none;
      line-height: 1.3;
      display: block;
    }
    .result-item a.result-title:hover {
      text-decoration: underline;
    }
    .result-item .result-url {
      font-size: 12px;
      color: #bdc1c6;
      margin: 2px 0 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-item .result-snippet {
      font-size: 13px;
      color: #9aa0a6;
      line-height: 1.5;
    }
    .result-item .result-source {
      font-size: 10px;
      color: #5f6368;
      margin-top: 4px;
    }
    /* Data results (key-value pairs) */
    .data-result {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1a;
    }
    .data-result .data-label {
      font-size: 12px;
      color: #5f6368;
      min-width: 120px;
    }
    .data-result .data-value {
      font-size: 13px;
      color: #e8eaed;
    }
    .results-section {
      margin-bottom: 24px;
    }
    .results-section-title {
      font-size: 11px;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a2a;
    }

    .related-people {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .related-person {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .related-person:hover {
      background: #1a1a1a;
      border-color: #333;
    }

    .related-person-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
    }

    .related-person-name {
      font-size: 13px;
      color: #aaa;
    }

    .loading-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #555;
    }

    .loading-results .spinner {
      margin-bottom: 16px;
    }

    .loading-sources {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .loading-source {
      font-size: 10px;
      padding: 4px 10px;
      background: #1a1a1a;
      border-radius: 4px;
      color: #666;
    }

    .loading-source.active {
      background: #1a2a3a;
      color: #7ac;
      animation: pulse 1s infinite;
    }

    .loading-source.done {
      background: #1a2a1a;
      color: #6a6;
    }

    .no-results-found {
      text-align: center;
      padding: 40px;

      //=========================================
      // ANALYZE QUERY
      //=========================================
      analyze(query) {
        const result = {
          query: query,
          entities: [],
          nlpEntities: [], // NLP-detected entities
          recommendedOptions: [],
          allOptions: [],
        };

        // Detect entities using regex patterns
        for (const [type, config] of Object.entries(this.entities)) {
          const matches = query.match(config.pattern);
          if (matches) {
            result.entities.push({
              type,
              label: config.label,
              values: [...new Set(matches)],
              country: config.country,
              category: config.category,
              sensitive: config.sensitive,
            });
          }
        }

        // Use NLP module for advanced entity detection if available
        if (window.NLP && window.NLP.ready) {
          try {
            const nlpResults = window.NLP.extractEntities(query);

            // Add detected people
            if (nlpResults.people && nlpResults.people.length > 0) {
              result.nlpEntities.push(...nlpResults.people.map(p => ({
                type: 'person',
                label: 'Person',
                value: p.text,
                normalized: p.normalized,
                confidence: p.confidence,
                source: 'nlp'
              })));

              // Add 'person' entity type for forEntities matching
              if (!result.entities.some(e => e.type === 'person')) {
                result.entities.push({
                  type: 'person',
                  label: 'Person',
                  values: nlpResults.people.map(p => p.text),
                  category: 'identity',
                  source: 'nlp'
                });
              }
            }

            // Add detected organizations
            if (nlpResults.organizations && nlpResults.organizations.length > 0) {
              result.nlpEntities.push(...nlpResults.organizations.map(o => ({
                type: 'organization',
                label: 'Organization',
                value: o.text,
                source: 'nlp'
              })));
            }

            // Add detected places
            if (nlpResults.places && nlpResults.places.length > 0) {
              result.nlpEntities.push(...nlpResults.places.map(p => ({
                type: 'place',
                label: 'Place',
                value: p.text,
                source: 'nlp'
              })));
            }
          } catch (e) {
            console.warn('NLP analysis failed:', e);
          }
        } else {
          // Fallback: check if it looks like a name (capitalized words)
          const namePattern = /^[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+$/;
          if (namePattern.test(query.trim())) {
            result.entities.push({
              type: 'person',
              label: 'Person',
              values: [query.trim()],
              category: 'identity',
              source: 'pattern'
            });
            result.nlpEntities.push({
              type: 'person',
              label: 'Person',
              value: query.trim(),
              confidence: 0.7,
              source: 'pattern'
            });
          }
        }

        // Find matching options based on entities
        const entityTypes = result.entities.map(e => e.type);
        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.forEntities?.some(e => entityTypes.includes(e))) {
            result.recommendedOptions.push({ key, ...opt, reason: 'entity' });
          }
        }

        // Find matching options based on intent triggers
        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.triggers?.test(query) && !result.recommendedOptions.some(r => r.key === key)) {
            result.recommendedOptions.push({ key, ...opt, reason: 'intent' });
          }
        }

        // If person detected via NLP but no recommendations yet, add People Intelligence first
        if (result.nlpEntities.some(e => e.type === 'person') && result.recommendedOptions.length === 0) {
          result.recommendedOptions.push({ key: 'peopleIntel', ...this.searchOptions.peopleIntel, reason: 'nlp-person' });
          result.recommendedOptions.push({ key: 'person', ...this.searchOptions.person, reason: 'nlp-person' });
        }

        // Add general search if no specific recommendations
        if (result.recommendedOptions.length === 0) {
          result.recommendedOptions.push({ key: 'general', ...this.searchOptions.general, reason: 'default' });
        }

        // All other options
        result.allOptions = Object.entries(this.searchOptions)
          .filter(([key]) => !result.recommendedOptions.some(r => r.key === key))
          .map(([key, opt]) => ({ key, ...opt }));

        return result;
      },

      //=========================================
      // EXECUTE SEARCH
      //=========================================
      executeSearch(query, optionKey, mode = 'redirect') {
        const option = this.searchOptions[optionKey];
        if (!option) return;

        const queries = option.buildQuery(query);
        const searches = option.engines
          .filter(eng => queries[eng] !== null && queries[eng] !== undefined)
          .map(eng => ({
            engine: eng,
            url: this.engines[eng](queries[eng] || queries.default || query),
            query: queries[eng] || queries.default || query,
          }));

        if (mode === 'tabs') {
          searches.forEach((s, i) => {
            setTimeout(() => window.open(s.url, '_blank'), i * 150);
          });
        } else {
          window.location.href = searches[0].url;
        }

        return searches;
      }
    };

      // Recommended options
      if (analysis.recommendedOptions.length > 0) {
        html += `
          <div class="section-title" data-section="recommended">Recommended</div>
          <div class="options-grid" data-grid="recommended">
            ${analysis.recommendedOptions.map(opt => renderOption(opt, analysis.query, true)).join('')}

      }

      // Other options
      if (analysis.allOptions.length > 0) {
        html += `
          <div class="divider" data-section="other"></div>
          <div class="section-title" data-section="other">Other Options</div>
          <div class="options-grid" data-grid="other">
            ${analysis.allOptions.map(opt => renderOption(opt, analysis.query, false)).join('')}
          </div>
        `;
      }

      html += `
        <div class="no-results" id="no-results" style="display: none;">No options match your filter</div>
        <div class="footer">
          Click to view all sources • Shift+Click to open all in tabs • Ctrl+Click to open first source only
        </div>
      `;

      app.innerHTML = html;

      // Add click handlers
      document.querySelectorAll('.option-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          const optionKey = card.dataset.option;
          const option = OSINT.searchOptions[optionKey];

          if (e.shiftKey) {
            // Shift+Click: Open all engines in separate tabs
            OSINT.executeSearch(analysis.query, optionKey, 'tabs');
          } else if (e.ctrlKey || e.metaKey) {
            // Ctrl/Cmd+Click: Redirect to first source (old behavior)
            OSINT.executeSearch(analysis.query, optionKey, 'redirect');
          } else if (option && option.useRealResults) {
            // Use the new real results view for options that support it
            renderRealSearchResults(analysis.query, optionKey);
          } else {
            // Regular click: Show multi-source results view (iframe-based)
            renderMultiSourceResults(analysis.query, optionKey);
          }
        });
      });

      // Add filter functionality
      const filterInput = document.getElementById('option-filter');
      filterInput.addEventListener('input', (e) => {
        const filterValue = e.target.value.toLowerCase().trim();
        const allCards = document.querySelectorAll('.option-card');
        let visibleRecommended = 0;
        let visibleOther = 0;

        allCards.forEach(card => {
          const title = card.querySelector('.option-title').textContent.toLowerCase();
          const desc = card.querySelector('.option-desc').textContent.toLowerCase();
          const engines = card.querySelector('.engines-preview').textContent.toLowerCase();
          const matches = title.includes(filterValue) || desc.includes(filterValue) || engines.includes(filterValue);

          card.classList.toggle('hidden', !matches);

          if (matches) {
            if (card.classList.contains('recommended')) {
              visibleRecommended++;
            } else {
              visibleOther++;
            }
          }
        });

        // Show/hide section headers
        const recommendedSection = document.querySelectorAll('[data-section="recommended"]');
        const otherSection = document.querySelectorAll('[data-section="other"]');
        const noResults = document.getElementById('no-results');

        recommendedSection.forEach(el => el.style.display = visibleRecommended > 0 ? '' : 'none');
        document.querySelector('[data-grid="recommended"]').style.display = visibleRecommended > 0 ? '' : 'none';

        if (document.querySelector('[data-grid="other"]')) {
          otherSection.forEach(el => el.style.display = visibleOther > 0 ? '' : 'none');
          document.querySelector('[data-grid="other"]').style.display = visibleOther > 0 ? '' : 'none';
        }

        noResults.style.display = (visibleRecommended + visibleOther === 0) ? '' : 'none';
      });
    }

    function renderOption(opt, query, recommended) {

            <span class="option-icon">${getIcon(opt.icon)}</span>

          <div class="engines-preview">${enginePreview}</div>

      realSearchState = {

      // Handle OSINT sources from PDFs
      if (option.useOSINTSources && window.SearchEngine) {
        // If searchAllOSINT is set, search all OSINT sources
        if (option.searchAllOSINT) {
          const loadingEl = document.querySelector('.loading-sources');
          if (loadingEl) loadingEl.innerHTML = '<span class="loading-source active">Searching 80+ OSINT sources...</span>';

          try {
            const osintResults = await window.SearchEngine.searchAllOSINT(query);
            realSearchState.sources['osint'] = osintResults || [];
            realSearchState.results = osintResults || [];
            realSearchState.loading = false;
            return;
          } catch (e) {
            console.warn('OSINT search failed:', e);
          }
        }

        // If osintCollection is set, search that specific source collection
        if (option.osintCollection) {
          const loadingEl = document.querySelector('.loading-sources');
          const collectionName = option.osintCollection.replace('Sources', '');
          if (loadingEl) loadingEl.innerHTML = `<span class="loading-source active">Searching ${collectionName} sources...</span>`;

            realSearchState.loading = false;
            return;
          } catch (e) {
            console.warn('OSINT collection search failed:', e);
          }
        }

        // If osintCollections (plural) is set, search multiple source collections and combine results
        if (option.osintCollections && Array.isArray(option.osintCollections)) {
          const loadingEl = document.querySelector('.loading-sources');
          const collectionNames = option.osintCollections.map(c => c.replace('Sources', '')).join(' + ');
          if (loadingEl) loadingEl.innerHTML = `<span class="loading-source active">Searching ${collectionNames} sources...</span>`;

          try {
            const allResults = [];
            const searchPromises = option.osintCollections.map(collection =>
              window.SearchEngine.searchOSINTCollection(collection, query)
            );
            const settled = await Promise.allSettled(searchPromises);
            settled.forEach(result => {
              if (result.status === 'fulfilled' && result.value) {
                allResults.push(...result.value);
              }
            });
            realSearchState.sources['osint'] = allResults;
            realSearchState.results = allResults;
            realSearchState.loading = false;
            return;
          } catch (e) {
            console.warn('OSINT collections search failed:', e);

          const loadingEl = document.querySelector('.loading-sources');

            const osintResults = await window.SearchEngine.searchOSINTCategory(option.osintCategory, query);
            realSearchState.sources['osint'] = osintResults || [];
            realSearchState.results = osintResults || [];
            realSearchState.loading = false;
            return;
          } catch (e) {
            console.warn('OSINT category search failed:', e);
          }
        }
      }

      // Fetch from each source in parallel
      const promises = sources.map(async (source) => {
        const loadingEl = document.getElementById(`loading-${source}`);
        try {
          const fetchFn = fetchFunctions[source];
          if (fetchFn) {
            const sourceResults = await fetchFn();
            if (loadingEl) loadingEl.classList.replace('active', 'done');
            realSearchState.sources[source] = sourceResults || [];
            return { source, results: sourceResults || [] };
          }
        } catch (e) {
          console.warn(`Failed to fetch from ${source}:`, e);
          if (loadingEl) loadingEl.style.background = '#2a1a1a';
        }
        return { source, results: [] };
      });

      const settled = await Promise.allSettled(promises);

      // Collect all results
      settled.forEach(result => {
        if (result.status === 'fulfilled' && result.value.results) {
          results.push(...result.value.results.map(r => ({
            ...r,
            _source: result.value.source
          })));
        }
      });

      realSearchState.results = results;
      realSearchState.loading = false;
    }

    function renderFetchedResults() {
      const { results, sources, query, option, activeSource } = realSearchState;
      const app = document.getElementById('app');

      // Get source counts
      const sourceCounts = {};
      Object.entries(sources).forEach(([src, res]) => {
        sourceCounts[src] = res.length;
      });

      // Filter results by active source
      const filteredResults = activeSource === 'all'
        ? results
        : results.filter(r => r._source === activeSource);

      // Find summary (from DuckDuckGo or Wikipedia)
      const summary = results.find(r => r.type === 'answer' || r.type === 'summary');
      const infobox = results.find(r => r.type === 'infobox');

      // Group by type - separate quick info results from web results
      const quickInfoTypes = ['ip', 'whois', 'phone', 'dns', 'trademark', 'vin', 'email', 'username', 'crypto', 'company', 'location'];
      const quickInfoResults = filteredResults.filter(r => quickInfoTypes.includes(r.type));
      const webResults = filteredResults.filter(r => !['answer', 'summary', 'infobox', 'discussion', ...quickInfoTypes].includes(r.type));
      const discussions = filteredResults.filter(r => r.type === 'discussion' || r._source === 'reddit');

      let html = `
        <div class="results-header">
          <div class="results-query">
            Results for <span>"${escapeHtml(query)}"</span>
          </div>
          <button class="results-back" onclick="goBack()">Back to Options</button>
        </div>
        <div class="search-results-container">
      `;

      // Summary card (if found)
      if (summary) {
        html += `
          <div class="person-summary">
            ${summary.image ? `<img src="${summary.image}" class="person-summary-image" alt="" onerror="this.classList.add('placeholder');this.innerHTML='&#128100;';">` : `<div class="person-summary-image placeholder">&#128100;</div>`}

              <div class="person-summary-title">${escapeHtml(summary.title || query)}</div>
              <div class="person-summary-source">
                <img src="https://www.google.com/s2/favicons?domain=${summary.source?.toLowerCase() || 'wikipedia'}.org&sz=32" alt="">
                ${summary.source || 'Wikipedia'}
              </div>
              <div class="person-summary-desc">${escapeHtml(summary.description || summary.snippet || summary.extract || '')}</div>
              ${summary.url ? `<a href="${summary.url}" target="_blank" style="color:#7ac;font-size:12px;margin-top:8px;display:inline-block;">Read more</a>` : ''}
            </div>
          </div>
        `;
      }

      // Infobox (if found)
      if (infobox && infobox.data) {
        html += `
          <div class="infobox">
            <div class="infobox-title">Quick Facts</div>
            <div class="infobox-grid">
              ${Object.entries(infobox.data).slice(0, 8).map(([label, value]) => `
                <div class="infobox-item">
                  <span class="infobox-label">${escapeHtml(label)}</span>
                  <span class="infobox-value">${escapeHtml(String(value))}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Quick Info Panel (phone, IP, WHOIS, etc.) - Always at top
      if (quickInfoResults.length > 0) {
        // Group quick info by type for organized display
        const groupedQuickInfo = {};
        quickInfoResults.forEach(r => {
          const type = r.type || 'info';
          if (!groupedQuickInfo[type]) groupedQuickInfo[type] = [];
          groupedQuickInfo[type].push(r);
        });

        const typeLabels = {
          'phone': '📞 Phone Info',
          'ip': '🌐 IP Address Info',
          'whois': '🔍 Domain Info',
          'dns': '📡 DNS Records',
          'vin': '🚗 VIN Info',
          'email': '📧 Email Info',
          'username': '👤 Username Info',
          'crypto': '💰 Crypto Address',
          'company': '🏢 Company Info',
          'trademark': '™️ Trademark',
          'location': '📍 Location'
        };

        html += `<div class="quick-info-panel">`;

        Object.entries(groupedQuickInfo).forEach(([type, items]) => {
          html += `
            <div class="quick-info-section">
              <div class="quick-info-header">${typeLabels[type] || '📋 Info'}</div>
              <div class="quick-info-grid">
                ${items.map(item => `
                  <div class="quick-info-item">
                    <span class="quick-info-label">${escapeHtml(item.title || '')}</span>
                    <span class="quick-info-value">${escapeHtml(item.snippet || '')}</span>
                    ${item.url ? `<a href="${item.url}" target="_blank" class="quick-info-link">View →</a>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        });

        html += `</div>`;
      }

      // Source tabs
      html += `
        <div class="source-tabs-mini">
          <button class="source-tab-mini ${activeSource === 'all' ? 'active' : ''}" onclick="filterRealResults('all')">
            All <span class="count">(${results.length})</span>
          </button>
          ${Object.entries(sourceCounts).filter(([_, count]) => count > 0).map(([src, count]) => `
            <button class="source-tab-mini ${activeSource === src ? 'active' : ''}" onclick="filterRealResults('${src}')">
              ${src} <span class="count">(${count})</span>
            </button>
          `).join('')}
        </div>
      `;

      // Web results - grouped by domain
      if (webResults.length > 0) {
        // Group results by domain
        const domainGroups = {};
        webResults.forEach(r => {
          try {
            const url = new URL(r.url || '');
            const domain = url.hostname.replace(/^www\./, '');
            if (!domainGroups[domain]) {
              domainGroups[domain] = [];
            }
            domainGroups[domain].push(r);
          } catch (e) {
            // Invalid URL, put in 'other' group
            if (!domainGroups['other']) domainGroups['other'] = [];
            domainGroups['other'].push(r);
          }
        });

        // Sort domains by result count (descending)
        const sortedDomains = Object.entries(domainGroups)
          .sort((a, b) => b[1].length - a[1].length);

        html += `
          <div class="results-section">
            <div class="results-section-title">
              Search Results <span class="results-section-count">${webResults.length}</span>
            </div>
            ${sortedDomains.map(([domain, domainResults], index) => `
              <div class="domain-group">
                <div class="domain-group-header${index > 2 ? ' collapsed' : ''}" onclick="toggleDomainGroup(this)">
                  <svg class="domain-group-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6,9 12,15 18,9"></polyline>
                  </svg>
                  <img class="domain-group-favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="" onerror="this.style.display='none'">
                  <span class="domain-group-name">${escapeHtml(domain)}</span>
                  <span class="domain-group-count">${domainResults.length} result${domainResults.length > 1 ? 's' : ''}</span>
                </div>
                <div class="domain-group-content"${index > 2 ? ' style="display:none"' : ''}>
                  ${domainResults.map(r => renderResultCard(r)).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      // Discussions
      if (discussions.length > 0) {
        html += `
          <div class="results-section">
            <div class="results-section-title">
              Discussions <span class="results-section-count">${discussions.length}</span>
            </div>
            ${discussions.map(r => renderResultCard(r)).join('')}
          </div>
        `;
      }

      // No results
      if (filteredResults.length === 0) {
        html += `
          <div class="no-results-found">
            <div class="no-results-found-icon">&#128269;</div>
            <div>No results found from the selected sources.</div>
            <div style="margin-top:12px;font-size:12px;">Try a different search or check back later.</div>
          </div>
        `;
      }

      html += `
          <div class="footer" style="margin-top:24px;">
            Results fetched from: ${Object.keys(sources).filter(s => sources[s].length > 0).join(', ')}
          </div>
        </div>
      `;

      app.innerHTML = html;
    }

    function renderResultCard(result) {
      // Simple Google-style result
      if (result.url) {
        const hostname = new URL(result.url).hostname.replace('www.', '');
        return `
          <div class="result-item">
            <a href="${result.url}" target="_blank" class="result-title">${escapeHtml(result.title || 'Untitled')}</a>
            <div class="result-url">${hostname}</div>
            ${result.snippet ? `<div class="result-snippet">${escapeHtml(result.snippet.substring(0, 200))}</div>` : ''}
            <div class="result-source">${result.source || 'Web'}</div>
          </div>
        `;
      }
      // Data result (no URL - key/value display)
      return `
        <div class="data-result">
          <span class="data-label">${escapeHtml(result.title || '')}</span>
          <span class="data-value">${escapeHtml(result.snippet || '')}</span>
        </div>
      `;
    }

    function filterRealResults(source) {
      realSearchState.activeSource = source;
      renderFetchedResults();
    }

    //=========================================
    // MULTI-SOURCE RESULTS VIEW (Iframe-based)
    //=========================================
    let currentView = 'grid'; // 'grid' or 'single'
    let activeSource = null;
    let sourceStates = {}; // Track loading states

    function renderMultiSourceResults(query, optionKey) {
      const option = OSINT.searchOptions[optionKey];
      if (!option) return;

      const queries = option.buildQuery(query);
      const searches = option.engines
        .filter(eng => queries[eng] !== null && queries[eng] !== undefined)
        .map(eng => ({
          engine: eng,
          url: OSINT.engines[eng](queries[eng] || queries.default || query),
          query: queries[eng] || queries.default || query,
        }));

      // Initialize source states
      sourceStates = {};
      searches.forEach(s => {
        sourceStates[s.engine] = 'loading';
      });

      // Set first source as active for single view
      activeSource = searches[0]?.engine || null;

      const app = document.getElementById('app');
      app.classList.remove('container');
      app.classList.add('results-container');

      let html = `
        <div class="results-header">
          <div class="results-query">
            Results for <span>"${escapeHtml(query)}"</span> from <span>${option.title}</span>
          </div>
          <div style="display: flex; align-items: center;">
            <button class="results-back" onclick="goBack()">Back to Options</button>
            <div class="view-toggle">
              <button class="view-toggle-btn ${currentView === 'grid' ? 'active' : ''}" data-view="grid" title="Grid View">Grid</button>
              <button class="view-toggle-btn ${currentView === 'single' ? 'active' : ''}" data-view="single" title="Single View">Single</button>
            </div>
          </div>
        </div>

        <div class="source-tabs" id="source-tabs">
          ${searches.map((s, i) => `
            <button class="source-tab ${i === 0 ? 'active' : ''}" data-engine="${s.engine}">
              ${s.engine}
              <span class="tab-status loading" data-status="${s.engine}"></span>
            </button>
          `).join('')}
        </div>

        <div class="results-summary">
          <span class="results-count">${searches.length} sources</span>
          <span>Click a tab to focus, or use grid view to see all</span>
        </div>

        <div class="results-grid ${currentView === 'single' ? 'single-view' : ''}" id="results-grid">
          ${searches.map((s, i) => renderSourcePanel(s, i === 0 || currentView === 'grid')).join('')}
        </div>

        <div class="footer" style="margin-top: 20px;">
          Some sites may block embedding. Click "Open in New Tab" to view directly.
        </div>
      `;

      app.innerHTML = html;

      // Add event listeners
      setupResultsEventListeners(searches);

      // Start loading iframes with staggered delay
      searches.forEach((s, i) => {
        setTimeout(() => {
          loadSourceIframe(s.engine, s.url);
        }, i * 300); // 300ms stagger to avoid overwhelming
      });
    }

    function renderSourcePanel(search, visible) {
      return `
        <div class="source-panel ${visible ? '' : 'hidden'}" data-panel="${search.engine}" id="panel-${search.engine}">
          <div class="source-panel-header">
            <div class="source-panel-title">
              <span class="status-dot" data-dot="${search.engine}"></span>
              ${search.engine}
            </div>
            <div class="source-panel-actions">
              <button class="source-panel-btn" onclick="openInNewTab('${search.url}')">Open in New Tab</button>
              <button class="source-panel-btn" onclick="refreshSource('${search.engine}', '${search.url}')">Refresh</button>
            </div>
          </div>
          <div class="source-iframe-container" id="iframe-container-${search.engine}">
            <div class="source-loading" id="loading-${search.engine}">
              <div class="spinner"></div>
              Loading ${search.engine}...
            </div>
          </div>
        </div>
      `;
    }

    function loadSourceIframe(engine, url) {
      const container = document.getElementById(`iframe-container-${engine}`);
      const loadingEl = document.getElementById(`loading-${engine}`);

      if (!container) return;

      // Create iframe
      const iframe = document.createElement('iframe');
      iframe.className = 'source-iframe';
      iframe.id = `iframe-${engine}`;
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
      iframe.setAttribute('loading', 'lazy');

      // Handle load success
      iframe.onload = () => {
        updateSourceState(engine, 'loaded');
        if (loadingEl) loadingEl.style.display = 'none';
      };

      // Handle load error (many sites block iframes)
      iframe.onerror = () => {
        showSourceError(engine, url);
      };

      // Set a timeout to show error if iframe doesn't load
      const timeout = setTimeout(() => {
        if (sourceStates[engine] === 'loading') {
          // Check if iframe has content
          try {
            // If we can't access iframe content due to CORS, show error
            const doc = iframe.contentDocument || iframe.contentWindow?.document;
            if (!doc || !doc.body || doc.body.innerHTML === '') {
              showSourceError(engine, url);
            }
          } catch (e) {
            // CORS error means it might have loaded
            updateSourceState(engine, 'loaded');
            if (loadingEl) loadingEl.style.display = 'none';
          }
        }
      }, 8000);

      iframe.src = url;
      container.appendChild(iframe);

      // Store timeout for cleanup
      iframe.dataset.timeout = timeout;
    }

    function showSourceError(engine, url) {
      updateSourceState(engine, 'error');
      const container = document.getElementById(`iframe-container-${engine}`);
      const loadingEl = document.getElementById(`loading-${engine}`);
      const existingIframe = document.getElementById(`iframe-${engine}`);

      if (loadingEl) loadingEl.style.display = 'none';
      if (existingIframe) existingIframe.style.display = 'none';

      // Check if error div already exists
      if (container && !container.querySelector('.source-error')) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'source-error';
        errorDiv.innerHTML = `
          <div class="source-error-icon">🚫</div>
          <div class="source-error-msg">
            ${engine} doesn't allow embedding.<br>
            Click below to view results directly.
          </div>
          <button class="source-error-btn" onclick="openInNewTab('${url}')">
            Open ${engine} in New Tab
          </button>
        `;
        container.appendChild(errorDiv);
      }
    }

    function updateSourceState(engine, state) {
      sourceStates[engine] = state;

      // Update tab status indicator
      const tabStatus = document.querySelector(`[data-status="${engine}"]`);
      if (tabStatus) {
        tabStatus.className = `tab-status ${state}`;
      }

      // Update panel status dot
      const panelDot = document.querySelector(`[data-dot="${engine}"]`);
      if (panelDot) {
        panelDot.className = `status-dot ${state}`;
      }
    }

    function setupResultsEventListeners(searches) {
      // Tab click handlers
      document.querySelectorAll('.source-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const engine = tab.dataset.engine;
          activeSource = engine;

          // Update tab active state
          document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          // In single view, show only the selected panel
          if (currentView === 'single') {
            document.querySelectorAll('.source-panel').forEach(panel => {
              panel.classList.toggle('hidden', panel.dataset.panel !== engine);
            });
          }
        });
      });

      // View toggle handlers
      document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const view = btn.dataset.view;
          if (view === currentView) return;

          currentView = view;

          // Update button states
          document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          // Update grid class
          const grid = document.getElementById('results-grid');
          grid.classList.toggle('single-view', view === 'single');

          // Update panel visibility
          document.querySelectorAll('.source-panel').forEach(panel => {
            if (view === 'grid') {
              panel.classList.remove('hidden');
            } else {
              panel.classList.toggle('hidden', panel.dataset.panel !== activeSource);
            }
          });
        });
      });
    }

    function openInNewTab(url) {
      window.open(url, '_blank');
    }

    function refreshSource(engine, url) {
      const container = document.getElementById(`iframe-container-${engine}`);
      const existingIframe = document.getElementById(`iframe-${engine}`);
      const existingError = container?.querySelector('.source-error');

      // Remove existing iframe and error
      if (existingIframe) existingIframe.remove();
      if (existingError) existingError.remove();

      // Show loading
      const loadingEl = document.getElementById(`loading-${engine}`);
      if (loadingEl) loadingEl.style.display = 'flex';

      // Reset state and reload
      updateSourceState(engine, 'loading');
      loadSourceIframe(engine, url);
    }

    function goBack() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      if (query) {
        // Reset container class
        const app = document.getElementById('app');
        app.classList.add('container');
        app.classList.remove('results-container');

        const analysis = OSINT.analyze(query);
        renderUI(analysis);
      } else {
        window.location.href = window.location.pathname;
      }
    }

    // Map entity types to search categories
    function searchEntityCategory(entityType, value) {
      const entityToCategoryMap = {
        // Contact entities
        'phone_us': 'phone',
        'phone_uk': 'phone',
        'phone_intl': 'phone',
        'phone_generic': 'phone',
        'email': 'email',
        // Identity entities
        'person': 'peopleIntel',
        'username': 'username',
        'ssn_us': 'person',
        // Network entities
        'ip': 'ip',
        'domain': 'domain',
        'url': 'domain',
        // Vehicle entities
        'vin': 'vehicle',
        'plate_us': 'vehicle',
        'plate_uk': 'vehicle',
        'plate_eu': 'vehicle',
        'serial': 'stolenProperty',
        'imei': 'stolenProperty',
        // Transport entities
        'flight': 'flight',
        'imo': 'ship',
        // Financial entities
        'iban': 'financial',
        'ein': 'company',
        // Crypto entities
        'btc': 'crypto',
        'btc_bech32': 'crypto',
        'eth': 'crypto',
        // Hash entities
        'md5': 'hash',
        'sha1': 'hash',
        'sha256': 'hash',
        // Security entities
        'cve': 'cve',
        // Academic entities
        'doi': 'academic',
        'isbn': 'academic',
        'arxiv': 'academic',
        'patent': 'patent',
        // Legal entities
        'case_us': 'legal',
        // Geo entities
        'coordinates': 'location',
        // Media entities
        'imageUrl': 'image',
      };

      const category = entityToCategoryMap[entityType] || 'general';
      renderRealSearchResults(value, category);
    }

    // Toggle domain group expand/collapse
    function toggleDomainGroup(header) {
      header.classList.toggle('collapsed');
      const content = header.nextElementSibling;
      if (content) {
        content.style.display = content.style.display === 'none' ? 'block' : 'none';
      }
    }

    function renderSearchBox() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="query-display">
          <div class="query-label">OSINT Query Processor</div>
        </div>
        <form class="search-box" id="search-form">
          <input type="text" class="search-input" id="search-input" placeholder="Enter name, email, phone, domain, IP..." autofocus>
          <button type="submit" class="search-btn">Analyze</button>
        </form>
        <div class="footer" style="margin-top: 16px;">
          Enter any query to detect entities and get search options
        </div>
      `;

      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.getElementById('search-input').value.trim();
        if (query) {
          window.location.href = `?q=${encodeURIComponent(query)}`;
        }
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    //=========================================
    // MAIN
    //=========================================
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      const auto = params.get('auto');
      const option = params.get('opt');

      // Initialize NLP module
      if (window.NLP) {
        await window.NLP.init();
      }

      // No query - show search box
      if (!query) {
        renderSearchBox();
        return;
      }

      // Auto mode with option - execute immediately
      if (auto && option && OSINT.searchOptions[option]) {
        OSINT.executeSearch(query, option, auto === 'tabs' ? 'tabs' : 'redirect');
        return;
      }

      // Analyze and show UI
      const analysis = OSINT.analyze(query);

      // If auto mode without option, use first recommended
      if (auto && analysis.recommendedOptions.length > 0) {
        OSINT.executeSearch(query, analysis.recommendedOptions[0].key, auto === 'tabs' ? 'tabs' : 'redirect');
        return;
      }

      renderUI(analysis);
    })();
  </script>
</body>
</html>
