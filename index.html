<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Query Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .query-display {
      text-align: center;
      margin-bottom: 32px;
    }
    .query-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .query-text {
      font-size: 18px;
      color: #ccc;
      word-break: break-word;
    }
    .detected-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      border-radius: 20px;
      font-size: 11px;
      color: #6a6;
    }
    .section-title {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .option-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .option-card:hover {
      background: #161616;
      border-color: #333;
      transform: translateY(-1px);
    }
    .option-card.recommended {
      border-color: #2a4a5a;
      background: #0d1a1f;
    }
    .option-card.recommended:hover {
      border-color: #3a6a7a;
      background: #112530;
    }
    .option-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .option-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .option-card .option-icon svg {
      color: #666;
    }
    .option-card.recommended .option-icon svg {
      color: #7ac;
    }
    .option-title {
      font-size: 13px;
      color: #bbb;
      font-weight: 500;
    }
    .option-card.recommended .option-title {
      color: #7ac;
    }
    .option-desc {
      font-size: 11px;
      color: #555;
      line-height: 1.4;
      padding-left: 32px;
    }
    .option-badge {
      font-size: 9px;
      color: #5a8a9a;
      background: #1a2a30;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: auto;
    }
    .engines-preview {
      font-size: 10px;
      color: #444;
      padding-left: 32px;
      margin-top: 6px;
    }
    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 24px 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #222;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 16px;
      color: #ccc;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: #333;
    }
    .search-input::placeholder {
      color: #444;
    }
    .search-btn {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px 20px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-btn:hover {
      background: #222;
      color: #aaa;
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 6px 12px;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover, .mode-btn.active {
      border-color: #444;
      color: #888;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #333;
    }
    .entity-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .entity-pill {
      padding: 3px 10px;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 12px;
      font-size: 10px;
    }
    .entity-pill .type { color: #666; }
    .entity-pill .value { color: #7ac; margin-left: 4px; }
    .entity-pill .country { color: #a86; margin-left: 4px; font-size: 9px; }
    .filter-container {
      margin-bottom: 16px;
      position: relative;
    }
    .filter-input {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px 10px 36px;
      color: #ccc;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .filter-input:focus {
      border-color: #333;
      background: #151515;
    }
    .filter-input::placeholder {
      color: #444;
    }
    .filter-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #444;
      pointer-events: none;
    }
    .filter-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }
    .option-card.hidden {
      display: none;
    }
    .no-results {
      text-align: center;
      padding: 24px;
      color: #444;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="spinner"></div>

    function getIcon(iconName) {
      return SVG_ICONS[iconName] || SVG_ICONS.search;
    }

    const OSINT = {
      //=========================================
      // SEARCH ENGINES
      //=========================================

        google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,

      //=========================================

      //=========================================
      // ANALYZE QUERY
      //=========================================
      analyze(query) {
        const result = {
          query: query,
          entities: [],
          recommendedOptions: [],
          allOptions: [],
        };

        // Detect entities
        for (const [type, config] of Object.entries(this.entities)) {
          const matches = query.match(config.pattern);
          if (matches) {
            result.entities.push({
              type,
              label: config.label,
              values: [...new Set(matches)],
              country: config.country,
              category: config.category,
              sensitive: config.sensitive,
            });
          }
        }

        // Find matching options based on entities
        const entityTypes = result.entities.map(e => e.type);
        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.forEntities?.some(e => entityTypes.includes(e))) {
            result.recommendedOptions.push({ key, ...opt, reason: 'entity' });
          }
        }

        // Find matching options based on intent triggers
        for (const [key, opt] of Object.entries(this.searchOptions)) {
          if (opt.triggers?.test(query) && !result.recommendedOptions.some(r => r.key === key)) {
            result.recommendedOptions.push({ key, ...opt, reason: 'intent' });
          }
        }

        // If no recommendations, check if it looks like a name (capitalized words)
        if (result.recommendedOptions.length === 0) {
          const namePattern = /^[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+$/;
          if (namePattern.test(query.trim())) {
            result.recommendedOptions.push({ key: 'person', ...this.searchOptions.person, reason: 'name' });
          }
        }

        // Add general search if no specific recommendations
        if (result.recommendedOptions.length === 0) {
          result.recommendedOptions.push({ key: 'general', ...this.searchOptions.general, reason: 'default' });
        }

        // All other options
        result.allOptions = Object.entries(this.searchOptions)
          .filter(([key]) => !result.recommendedOptions.some(r => r.key === key))
          .map(([key, opt]) => ({ key, ...opt }));

        return result;
      },

      //=========================================
      // EXECUTE SEARCH
      //=========================================
      executeSearch(query, optionKey, mode = 'redirect') {
        const option = this.searchOptions[optionKey];
        if (!option) return;

        const queries = option.buildQuery(query);
        const searches = option.engines
          .filter(eng => queries[eng] !== null && queries[eng] !== undefined)
          .map(eng => ({
            engine: eng,
            url: this.engines[eng](queries[eng] || queries.default || query),
            query: queries[eng] || queries.default || query,
          }));

        if (mode === 'tabs') {
          searches.forEach((s, i) => {
            setTimeout(() => window.open(s.url, '_blank'), i * 150);
          });
        } else {
          window.location.href = searches[0].url;
        }

        return searches;
      }
    };

    function renderUI(analysis) {
      const app = document.getElementById('app');

      let html = `

          <div class="query-text">${escapeHtml(analysis.query)}</div>
          ${analysis.entities.length > 0 ? `
            <div class="entity-pills">
              ${analysis.entities.map(e => `
                <div class="entity-pill">
                  <span class="type">${e.label}</span>
                  <span class="value">${escapeHtml(e.values[0].substring(0, 30))}${e.values[0].length > 30 ? '...' : ''}</span>
                  ${e.country ? `<span class="country">${e.country}</span>` : ''}
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>

        <div class="filter-container">
          <span class="filter-icon">${getIcon('search')}</span>
          <input type="text" class="filter-input" id="option-filter" placeholder="Filter options..." autocomplete="off">
        </div>
      `;

      // Recommended options
      if (analysis.recommendedOptions.length > 0) {
        html += `
          <div class="section-title" data-section="recommended">Recommended</div>
          <div class="options-grid" data-grid="recommended">
            ${analysis.recommendedOptions.map(opt => renderOption(opt, analysis.query, true)).join('')}
          </div>
        `;
      }

      // Other options
      if (analysis.allOptions.length > 0) {
        html += `
          <div class="divider" data-section="other"></div>
          <div class="section-title" data-section="other">Other Options</div>
          <div class="options-grid" data-grid="other">
            ${analysis.allOptions.map(opt => renderOption(opt, analysis.query, false)).join('')}
          </div>
        `;
      }

      html += `
        <div class="no-results" id="no-results" style="display: none;">No options match your filter</div>
        <div class="footer">
          Click an option to search • Hold Shift+Click to open all engines in tabs
        </div>
      `;

      app.innerHTML = html;

      // Add click handlers
      document.querySelectorAll('.option-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          const optionKey = card.dataset.option;
          const mode = e.shiftKey ? 'tabs' : 'redirect';
          OSINT.executeSearch(analysis.query, optionKey, mode);
        });
      });

      // Add filter functionality
      const filterInput = document.getElementById('option-filter');
      filterInput.addEventListener('input', (e) => {
        const filterValue = e.target.value.toLowerCase().trim();
        const allCards = document.querySelectorAll('.option-card');
        let visibleRecommended = 0;
        let visibleOther = 0;

        allCards.forEach(card => {
          const title = card.querySelector('.option-title').textContent.toLowerCase();
          const desc = card.querySelector('.option-desc').textContent.toLowerCase();
          const engines = card.querySelector('.engines-preview').textContent.toLowerCase();
          const matches = title.includes(filterValue) || desc.includes(filterValue) || engines.includes(filterValue);

          card.classList.toggle('hidden', !matches);

          if (matches) {
            if (card.classList.contains('recommended')) {
              visibleRecommended++;
            } else {
              visibleOther++;
            }
          }
        });

        // Show/hide section headers
        const recommendedSection = document.querySelectorAll('[data-section="recommended"]');
        const otherSection = document.querySelectorAll('[data-section="other"]');
        const noResults = document.getElementById('no-results');

        recommendedSection.forEach(el => el.style.display = visibleRecommended > 0 ? '' : 'none');
        document.querySelector('[data-grid="recommended"]').style.display = visibleRecommended > 0 ? '' : 'none';

        if (document.querySelector('[data-grid="other"]')) {
          otherSection.forEach(el => el.style.display = visibleOther > 0 ? '' : 'none');
          document.querySelector('[data-grid="other"]').style.display = visibleOther > 0 ? '' : 'none';
        }

        noResults.style.display = (visibleRecommended + visibleOther === 0) ? '' : 'none';
      });
    }

    function renderOption(opt, query, recommended) {
      const engineCount = opt.engines.length;
      const enginePreview = opt.engines.slice(0, 4).join(', ') + (engineCount > 4 ? ` +${engineCount - 4}` : '');

      return `
        <a href="#" class="option-card ${recommended ? 'recommended' : ''}" data-option="${opt.key}">
          <div class="option-header">
            <span class="option-icon">${getIcon(opt.icon)}</span>
            <span class="option-title">${opt.title}</span>
            ${recommended ? '<span class="option-badge">Recommended</span>' : ''}
          </div>
          <div class="option-desc">${opt.desc}</div>
          <div class="engines-preview">${enginePreview}</div>
        </a>
      `;
    }

        </div>
      `;

      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.getElementById('search-input').value.trim();
        if (query) {
          window.location.href = `?q=${encodeURIComponent(query)}`;
        }
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    //=========================================
    // MAIN
    //=========================================
    (function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      const auto = params.get('auto');
      const option = params.get('opt');

      // No query - show search box
      if (!query) {
        renderSearchBox();
        return;
      }

      // Auto mode with option - execute immediately
      if (auto && option && OSINT.searchOptions[option]) {
        OSINT.executeSearch(query, option, auto === 'tabs' ? 'tabs' : 'redirect');
        return;
      }

      // Analyze and show UI
      const analysis = OSINT.analyze(query);
      
      // If auto mode without option, use first recommended
      if (auto && analysis.recommendedOptions.length > 0) {
        OSINT.executeSearch(query, analysis.recommendedOptions[0].key, auto === 'tabs' ? 'tabs' : 'redirect');
        return;
      }

      renderUI(analysis);
    })();
  </script>
</body>
</html>
